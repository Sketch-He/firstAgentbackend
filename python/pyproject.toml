[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-demo-api"
version = "0.1.0"
description = "FastAPI scaffold for an agent-oriented chat demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.3,<3.0",
  "openai>=1.35,<2.0",
  "aiosqlite>=0.20,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
