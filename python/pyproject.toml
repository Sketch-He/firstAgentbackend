[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-demo-api"
version = "0.1.0"
description = "FastAPI scaffold for an agent-oriented chat demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.3,<3.0",
  "openai>=1.35,<2.0",
  "aiosqlite>=0.20,<1.0",
  "chromadb>=0.5,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "pypdf2>=3.0,<4.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "tiktoken>=0.7,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.5,<1.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # 行长度由 formatter 处理

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
